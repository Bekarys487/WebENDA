<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Fixed Table Reservation Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container" style="max-width: 500px;">
  <div class="card shadow-sm p-4">
    <h1 class="h2 mb-4">Reserve a table</h1>
    <form>
      <!-- Fixed 1 & 2: Added label, type, name, id for Name and Email -->
      <div class="mb-3">
        <label for="userName" class="form-label">Your name</label>
        <input type="text" class="form-control" id="userName" name="userName" required>
      </div>

      <div class="mb-3">
        <label for="userEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" required>
      </div>

      <!-- Fixed 3 & 4: Correct type="tel" and type="number" -->
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>

      <div class="mb-3">
        <label for="people" class="form-label">Guests</label>
        <input type="number" class="form-control" id="people" name="people" min="1" max="20" required>
      </div>

      <!-- Fixed 5: Native type="date" -->
      <div class="mb-3">
        <label for="resDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="resDate" name="resDate" required>
      </div>

      <!-- Fixed 6 & 7: Radio buttons with same name, unique id, connected labels -->
      <div class="mb-3">
        <label class="form-label d-block">Seating:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="Inside" checked>
          <label class="form-check-label" for="seatingInside">Inside</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="Terrace">
          <label class="form-check-label" for="seatingTerrace">Terrace</label>
        </div>
      </div>

      <!-- Fixed 8: Added select label and name attribute -->
      <div class="mb-3">
        <label for="mealType" class="form-label">Meal Type</label>
        <select class="form-select" id="mealType" name="mealType">
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
        </select>
      </div>

      <!-- Fixed 9: Added label and name for textarea -->
      <div class="mb-3">
        <label for="comments" class="form-label">Comments</label>
        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
      </div>

      <!-- Fixed 10: Checkbox inside label with id and for -->
      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
        <label class="form-check-label" for="terms">I agree to the terms</label>
      </div>

      <!-- Fixed 11: Replaced div with real button element -->
      <button type="submit" class="btn btn-primary w-100">Reserve</button>
    </form>
  </div>
</div>

</body>
</html>
