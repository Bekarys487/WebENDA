<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment 6 - jQuery</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: Georgia, serif; background: #f3ead8; }
  #menu { padding: 8px 12px; background: #5b3a29; display: flex; gap: 8px; align-items: center; }
  #menu span { color: #fff8e8; margin-right: 8px; font-weight: bold; }
  #menu button { padding: 6px 14px; border: 0; border-radius: 4px; background: #fff8e8; cursor: pointer; font-size: 14px; }
  #menu button.active { background: #f2b01e; font-weight: bold; }
  #frame { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
<div id="menu">
  <span>Assignment 6</span>
  <button data-page="Task1/index.html">Task 1</button>
  <button data-page="Task2/index.html">Task 2</button>
</div>
<iframe id="frame" title="Task"></iframe>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  function openTask(button) {
    $('#menu button').removeClass('active');
    button.addClass('active');
    $('#frame').attr('src', button.data('page'));
  }

  $('#menu button').on('click', function () {
    openTask($(this));
  });

  // open Task 1 first
  openTask($('#menu button').first());
</script>
</body>
</html>
