<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment 5</title>
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
<script src="kanban.js" defer></script>
<script src="ticket.js" defer></script>
</head>
<body>
<header><h1>Assignment 5: JavaScript</h1></header>
<main>

<section id="task1">
  <h2>Task 1. Code Breaker</h2>
  <p>Guess the 4-digit code with no repeated digits in 8 attempts.</p>
  <form id="guess-form" novalidate>
    <label for="guess">Your guess</label>
    <input id="guess" inputmode="numeric" maxlength="4" autocomplete="off">
    <button type="submit" id="guess-btn">Check</button>
    <button type="button" id="restart-btn">Restart</button>
  </form>
  <p id="game-msg" role="status"></p>
  <p id="attempts"></p>
  <ol id="history"></ol>
</section>

<section id="task2">
  <h2>Task 2. Kanban Board</h2>
  <div class="toolbar">
    <label for="tag-filter">Tag</label>
    <select id="tag-filter"></select>
    <label><input type="checkbox" id="sort-priority"> Sort by priority</label>
  </div>
  <label for="progress">Completed</label>
  <progress id="progress" max="100" value="0"></progress>
  <span id="progress-text"></span>
  <p id="board-msg" role="status"></p>
  <div id="board" class="board"></div>
</section>

<section id="task3">
  <h2>Task 3. Ticket Builder</h2>
  <div class="split">
    <form id="ticket-form">
      <p id="form-summary" role="alert" tabindex="-1"></p>

      <div class="field"><label for="event">Event</label>
        <select id="event" name="event" required>
          <option value="">Select...</option>
          <option>Concert</option>
          <option>Conference</option>
        </select><span class="error" id="event-error"></span></div>

      <div class="field"><label for="date">Date</label>
        <input type="date" id="date" name="date" required>
        <span class="error" id="date-error"></span></div>

      <div class="field"><label for="type">Ticket type</label>
        <select id="type" name="type" required></select>
        <span class="error" id="type-error"></span></div>

      <div class="field"><label for="qty">Quantity</label>
        <input type="number" id="qty" name="qty" min="1" max="10" required>
        <span class="error" id="qty-error"></span></div>

      <div class="field"><label for="name">Full name</label>
        <input id="name" name="name" minlength="2" required autocomplete="name">
        <span class="error" id="name-error"></span></div>

      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <span class="error" id="email-error"></span></div>

      <div class="field"><label for="promo">Promo code (optional)</label>
        <input id="promo" name="promo" autocomplete="off">
        <span class="error" id="promo-error"></span></div>

      <button type="submit">Buy</button>
    </form>

    <aside>
      <h3>Preview</h3>
      <div class="ticket" id="preview"></div>
      <h3>Result</h3>
      <div id="result"><p class="empty">No tickets yet.</p></div>
    </aside>
  </div>
</section>

</main>
</body>
</html>
