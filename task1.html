<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task1.css">
</head>
<body>

<div class="container my-4">
  <div class="ticket-card">
    <div class="ticket-header">
      <h2>Book a train ticket</h2>
    </div>
    <div class="ticket-body">
      <form>
        <div class="mb-4">
          <div class="trip-type-toggle">
            <input type="radio" class="btn-check" name="tripType" id="oneWay" checked>
            <label class="btn" for="oneWay">One way</label>

            <input type="radio" class="btn-check" name="tripType" id="roundTrip">
            <label class="btn" for="roundTrip">Round trip</label>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="fromCity" class="form-label">From</label>
            <input type="text" class="form-control" id="fromCity" value="Astana" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="toCity" class="form-label">To</label>
            <input type="text" class="form-control" id="toCity" value="Almaty" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-4">
            <label for="depDate" class="form-label">Departure</label>
            <input type="date" class="form-control" id="depDate" required>
          </div>
          <div class="col-12 col-md-4">
            <label for="retDate" class="form-label">Return</label>
            <input type="date" class="form-control" id="retDate">
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select class="form-select" id="passengers">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label d-block">Carriage class</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriageClass" id="seat" value="seat" required>
            <label class="form-check-label" for="seat">Seat</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriageClass" id="coupe" value="coupe" checked required>
            <label class="form-check-label" for="coupe">Coupé</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" value="sleeper" required>
            <label class="form-check-label" for="sleeper">Sleeper</label>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control" id="phone" placeholder="701 234 56 78" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-2 form-check">
          <input type="checkbox" class="form-check-input" id="smsOpt">
          <label class="form-check-label" for="smsOpt">Also send the ticket by SMS</label>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="rulesAgree" required>
          <label class="form-check-label" for="rulesAgree">I agree with the carriage rules</label>
        </div>

        <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
          <button type="reset" class="btn btn-clear">Clear</button>
          <button type="submit" class="btn btn-find">Find trains</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
